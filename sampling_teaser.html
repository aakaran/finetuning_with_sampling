  const sx=v=>631+(v-30)*7.0,sy=v=>435-(v-85)*18.1;
  for(let n=30;n<=70;n+=10){let x=sx(n);make('line',{x1:x,y1:127,x2:x,y2:435,class:'grid'},right);txt(right,String(n),x,459,{class:'tick','text-anchor':'middle'});}
  for(let n=85;n<=100;n+=5){let y=sy(n);make('line',{x1:631,y1:y,x2:943,y2:y,class:'grid'},right);txt(right,String(n),618,y+5,{class:'tick','text-anchor':'end'});}
  make('line',{x1:631,y1:435,x2:943,y2:435,class:'axis'},right);make('line',{x1:631,y1:127,x2:631,y2:435,class:'axis'},right);
  txt(right,'New Task Accuracy (%)',786,496,{class:'axis-title','text-anchor':'middle'});
  txt(right,'Prior Task Retention (%)',569,285,{class:'axis-title',transform:'rotate(-90 569 285)','text-anchor':'middle'});
  const pointElements=[];
  [['Base',C.base,10,22,'start'],['SFT',C.sft,0,-15,'middle'],['OPSD',C.opsd,-11,21,'end'],['Ours',C.ours,12,-12,'start']].forEach(([name,color,dx,dy,anchor])=>{
    const x=sx(data[name][0]),y=sy(data[name][6]/data.Base[6]*100);
    const g=make('g',{opacity:0},points);
    make('circle',{cx:x,cy:y,r:7,fill:color,stroke:'#1e2b21','stroke-width':1},g);
    txt(g,name,x+dx,y+dy,{class:'point-label','text-anchor':anchor,'font-weight':name==='Ours'?'bold':'normal'});
    pointElements.push(g);
  });
  [['SFT',C.sft],['On-Policy (OPSD)',C.opsd],['Ours (Sampling SFT)',C.ours]].forEach(([name,color],i)=>{
    const x=[235,425,672][i];make('rect',{x,y:551,width:22,height:13,fill:color},legend);
    txt(legend,name,x+30,563,{ 'font-size':18,'font-weight':i===2?'bold':'normal'});
  });
  const base=$('base-curve'),moving=$('moving-curve');
  const domainX=x=>65+(x+0.9)*(875/6.2),curveY=(x,mu)=>405-232*Math.exp(-.5*((x-mu)/.32)**2);
  function gaussianPath(mu){let top='',fill='M 65 405';for(let i=0;i<=360;i++){let x=-.9+i*6.2/360,X=domainX(x),Y=curveY(x,mu);top+=(i?' L ':'M ')+X.toFixed(2)+' '+Y.toFixed(2);fill+=' L '+X.toFixed(2)+' '+Y.toFixed(2);}return {top,fill:fill+' L 940 405 Z'};}
  const basePath=gaussianPath(0);
  make('path',{d:basePath.fill,fill:C.on,'fill-opacity':'.30'},base);
  make('path',{d:basePath.top,fill:'none',stroke:C.on,'stroke-width':3.3},base);
  const area=make('path',{fill:C.off,'fill-opacity':'.30'},moving);
  const line=make('path',{fill:'none',stroke:C.off,'stroke-width':3.3},moving);
  const headingOff=$('heading-off'),headingBoosted=$('heading-boosted');
  const modeData=$('mode-data'),modeTarget=$('mode-target');
  const initialProof=$('proof-initial'),finalProof=$('proof-final');
  function drawChart(t){
    let enter=smooth(t/1.05),collapse=t<2.35?1:1-smooth((t-2.35)/.90);
    let growth=enter*collapse;
    barElements.forEach(({bar,label,value})=>{
      let h=(value-20)*5*growth;bar.setAttribute('y',(baseline-h).toFixed(2));bar.setAttribute('height',h.toFixed(2));
      label.setAttribute('y',(baseline-h-9).toFixed(2));label.setAttribute('opacity',(smooth((growth-.68)/.28)).toFixed(3));
    });
    pointElements.forEach((g,i)=>{
      let reveal=smooth((t-(1.10+i*.27))/.15);
      g.setAttribute('opacity',(reveal*collapse).toFixed(3));
      g.setAttribute('transform',`translate(0 ${(1-reveal)*8})`);
    });
    $('chart-scene').style.opacity=String(t<3.25?1:0);
  }
  function drawDensity(t){
    $('density-scene').style.opacity=String(t<3.25?0:1);
    // One smooth journey from data through the intermediate location to the target.
    const progress=smooth((t-3.25)/3.40);
    const mu=4.5-3.2*progress;
    const color=progress<=.5?mix(C.off,C.intermediate,progress*2):mix(C.intermediate,C.target,(progress-.5)*2);
    const path=gaussianPath(mu);area.setAttribute('d',path.fill);area.setAttribute('fill',color);line.setAttribute('d',path.top);line.setAttribute('stroke',color);
    const center=domainX(mu).toFixed(1);
    [headingOff,headingBoosted,modeData,modeTarget].forEach(el=>el.setAttribute('x',center));
    headingOff.style.fill=color;headingBoosted.style.fill=color;
    headingOff.setAttribute('opacity',(1-smooth(progress/.45)).toFixed(3));
    headingBoosted.setAttribute('opacity',smooth((progress-.55)/.45).toFixed(3));
    modeData.setAttribute('opacity',(1-smooth(progress)).toFixed(3));
    modeTarget.setAttribute('opacity',smooth(progress).toFixed(3));
    // The solution text crossfades continuously as the Gaussian moves.
    const blend=smooth((progress-.12)/.76);
    initialProof.style.opacity=String(1-blend);
    finalProof.style.opacity=String(blend);
    initialProof.style.backgroundColor=color;
    finalProof.style.backgroundColor=color;
  }
  const duration=9.25;let clock=0,playing=true,last=null;
  const toggle=$('toggle');
  function tick(now){if(last!==null&&playing)clock=(clock+Math.min((now-last)/1000,.08))%duration;last=now;drawChart(clock);drawDensity(clock);requestAnimationFrame(tick);}
  toggle.addEventListener('click',()=>{
    playing=!playing;
    $('pause-icon').style.display=playing?'block':'none';
    $('play-icon').style.display=playing?'none':'block';
    const label=playing?'Pause animation':'Play animation';
    toggle.setAttribute('aria-label',label);
    toggle.setAttribute('title',label);
  });
  drawChart(0);drawDensity(0);requestAnimationFrame(tick);
})();
</script>
</body>
