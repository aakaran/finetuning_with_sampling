 const $=id=>document.getElementById(id);
 const answer=$('answer-words'),caret=$('proposer-caret');
 let idleTimer;
 function markTyping(){clearTimeout(idleTimer);caret.classList.remove('idle');idleTimer=setTimeout(()=>{caret.classList.add('idle');},210);}
 new MutationObserver(markTyping).observe(answer,{childList:true});
 function makeWord(w,cls=''){let span=document.createElement('span');span.className='word '+cls;span.dataset.word=w;const g=math[w];if(!g)throw Error('Missing TeX word: '+w);const glyph=document.createElement('span');glyph.className='math-token';glyph.style.width=g.w+'em';glyph.style.height=g.h+'em';glyph.style.verticalAlign=g.v+'em';glyph.style.webkitMaskImage=`url("${g.data}")`;glyph.style.maskImage=`url("${g.data}")`;span.append(glyph);return span;}

 $('question').replaceChildren(...questionWords.map(w=>makeWord(w)));
 $('answer-label').replaceChildren(makeWord('Answer:'));
 function render(words){answer.replaceChildren(...words.map(w=>makeWord(w)),caret);}
 function sleep(ms){return new Promise(resolve=>{let last=0,remaining=ms;function frame(now){if(!last)last=now;remaining-=Math.min(now-last,80);last=now;if(remaining<=0)resolve();else requestAnimationFrame(frame);}requestAnimationFrame(frame);});}
 function reset(){render([]);}
 async function continueBlock(words,green=false){
  const nodes=words.map(w=>makeWord(w,green?'proposal':'initial'));
  for(const node of nodes){await sleep(135);answer.insertBefore(node,caret);requestAnimationFrame(()=>node.classList.add('show'));}
  await sleep(220);
  if(green){
   await sleep(485);nodes.forEach(el=>el.classList.remove('proposal','show'));
  }else{
   nodes.forEach(el=>el.classList.remove('initial','show'));
  }

 async function proposal(action){
  const replaceCount=action.replaceCount??7;
  const existing=[...answer.querySelectorAll(':scope > .word')],old=action.appendOnly?[]:existing.slice(-replaceCount);
  if(!action.appendOnly&&old.length!==replaceCount)throw Error('Proposal replaceCount exceeds available words');
  if(!action.appendOnly){
   old.forEach(el=>el.classList.add('old'));
   await sleep(270);old.forEach(el=>el.classList.add('vanishing'));
   await sleep(185);old.forEach(el=>el.remove());
  }
  const proposed=action.words.map(w=>makeWord(w,action.accepted?'proposal':'proposal rejected'));
  for(const node of proposed){await sleep(65);answer.insertBefore(node,caret);requestAnimationFrame(()=>node.classList.add('show'));}
  await sleep(195);
  if(action.accepted){
   await sleep(485);proposed.forEach(el=>el.classList.remove('proposal','show'));
  }else{
   proposed.forEach(el=>{el.classList.remove('proposal');el.classList.add('old');});

   await sleep(170);proposed.forEach(el=>el.remove());

   const restored=restoreWords.map(w=>makeWord(w,'proposal'));

  }
