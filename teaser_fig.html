    function place(el,x,y,alpha,size,offset=0){

      el.style.opacity=alpha.toFixed(3);el.style.fontSize=size.toFixed(3)+'cqw';
    }
    function render(p,color){
      lastProgress=p;lastColor=color;root.style.color=color;
      if(!from.length||!to.length)return;
      const ease=smooth(p),size=2.19+(2.13-2.19)*ease;
      retained.forEach(({oldIndex,newIndex,el})=>{
        const q=from[oldIndex],r=to[newIndex];
        if(a[oldIndex]!==b[newIndex])el.innerHTML=tokenHTML(p<.5?a[oldIndex]:b[newIndex]);
        place(el,q.x+(r.x-q.x)*ease,q.y+(r.y-q.y)*ease,1,size);
      });
      removed.forEach(({oldIndex,el})=>{
        const q=from[oldIndex],start=.08+.53*oldIndex/Math.max(1,a.length-1);
        const fade=smooth((p-start)/.25);
        place(el,q.x,q.y,1-fade,2.19,-5*fade);
      });
      added.forEach(({newIndex,el})=>{
        const r=to[newIndex],start=.13+.52*newIndex/Math.max(1,b.length-1);
        const reveal=smooth((p-start)/.26);
        place(el,r.x,r.y,reveal,2.13,5*(1-reveal));
      });
    }
    measure();
    if(typeof ResizeObserver!=='undefined')new ResizeObserver(measure).observe(root);
    return {update:render,matched:matches.length,sourceCount:a.length,targetCount:b.length};
  }
  const questionProof=$('question'),answerEditor=createAnswerEditor($('answer-edit'));
  function drawChart(t){
    let enter=smooth(t/1.05),collapse=t<2.35?1:1-smooth((t-2.35)/.90);
    let growth=enter*collapse;
    barElements.forEach(({bar,label,value})=>{
      let h=(value-20)*5*growth;bar.setAttribute('y',(baseline-h).toFixed(2));bar.setAttribute('height',h.toFixed(2));
      label.setAttribute('y',(baseline-h-9).toFixed(2));label.setAttribute('opacity',(smooth((growth-.68)/.28)).toFixed(3));
    });
    pointElements.forEach((g,i)=>{
      let reveal=smooth((t-(1.10+i*.27))/.15);
      g.setAttribute('opacity',(reveal*collapse).toFixed(3));
      g.setAttribute('transform',`translate(0 ${(1-reveal)*8})`);
    });
    $('chart-scene').style.opacity=String(t<3.25?1:0);
  }
  function drawDensity(t){
    $('density-scene').style.opacity=String(t<3.25?0:1);
    // One smooth journey from data through the intermediate location to the target.
    const progress=smooth((t-3.25)/3.40);
    const mu=4.5-3.2*progress;
    const color=progress<=.5?mix(C.off,C.intermediate,progress*2):mix(C.intermediate,C.target,(progress-.5)*2);
    const path=gaussianPath(mu);area.setAttribute('d',path.fill);area.setAttribute('fill',color);line.setAttribute('d',path.top);line.setAttribute('stroke',color);
    const center=domainX(mu).toFixed(1);
    [headingOff,headingBoosted,modeData,modeTarget].forEach(el=>el.setAttribute('x',center));
    headingOff.style.fill=color;headingBoosted.style.fill=color;
    headingOff.setAttribute('opacity',(1-smooth(progress/.45)).toFixed(3));
    headingBoosted.setAttribute('opacity',smooth((progress-.55)/.45).toFixed(3));
    modeData.setAttribute('opacity',(1-smooth(progress)).toFixed(3));
    modeTarget.setAttribute('opacity',smooth(progress).toFixed(3));
    // The solution text crossfades continuously as the Gaussian moves.
    const editProgress=smooth((progress-.12)/.76);
    questionProof.style.backgroundColor=color;
    answerEditor.update(editProgress,color);
  }
  const duration=9.25;let clock=0,playing=true,last=null;
  const toggle=$('toggle');
  function tick(now){if(last!==null&&playing)clock=(clock+Math.min((now-last)/1000,.08))%duration;last=now;drawChart(clock);drawDensity(clock);requestAnimationFrame(tick);}
  toggle.addEventListener('click',()=>{
    playing=!playing;
    $('pause-icon').style.display=playing?'block':'none';
    $('play-icon').style.display=playing?'none':'block';
    const label=playing?'Pause animation':'Play animation';
    toggle.setAttribute('aria-label',label);
    toggle.setAttribute('title',label);
  });
  drawChart(0);drawDensity(0);requestAnimationFrame(tick);
})();
</script>
